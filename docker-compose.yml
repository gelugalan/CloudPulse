services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cloudpulse:cloudpulse@db:5432/cloudpulse
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: cloudpulse
      POSTGRES_DB: cloudpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:      